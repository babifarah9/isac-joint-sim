[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isac-joint-sim"
version = "0.1.0"
description = "Interactive 3GPP-aligned educational ISAC sensing and communications simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "plotly>=5.18", "streamlit>=1.37"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
